<style>
/*===== RESET =====*/
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--gold:#B8975A;--gold-l:#C4A46B;--gold-s:#E7D9B8;--green:#2C5F4A;--green-l:#3E7F65;
--paper:#FAFAF8;--paper2:#F2F0EC;--card:#FFFFFF;
--ink:#1A1A1A;--ink2:#6B6B6B;--ink3:#9B9B9B;--line:#E8E4DC;
--night:#0F0F0E;--night2:#1A1917;--night3:#222019;--fog:#F0EDE8;--fog2:#8A8480;--edge:#2A2825;
--amber:#A87528;--amber-s:#F5EAD3;--rose:#9B3A3A;--rose-s:#F4DEDB;
--r:16px;--r-sm:12px;--r-full:999px;
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
html.dark{--paper:#0F0F0E;--paper2:#1A1917;--card:#1A1917;--ink:#F0EDE8;--ink2:#8A8480;--ink3:#5a5752;--line:#2A2825;}
html{background:var(--paper);scroll-behavior:smooth}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;transition:background .4s,color .4s}
.dp{font-family:"Noto Naskh Arabic",serif}
.sn{font-family:"DM Serif Display",serif}
::selection{background:rgba(184,151,90,.2)}
img{max-width:100%;display:block;border-radius:var(--r)}
a{color:inherit;text-decoration:none}
button{border:none;background:none;cursor:pointer;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit;background:transparent;border:none;outline:none}

/*===== PHONE FRAME =====*/
.phone-wrap{display:flex;justify-content:center;align-items:flex-start;min-height:100dvh;padding:24px 0;background:var(--paper2)}
.phone{width:390px;min-height:844px;position:relative;background:var(--paper);overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.25),0 0 0 11px #1a1917,0 0 0 12px #0a0a09;border-radius:44px;transition:background .4s}
@media(max-width:480px){
  .phone-wrap{padding:0;background:var(--paper)}
  .phone{width:100%;min-height:100dvh;border-radius:0;box-shadow:none}
}

/*===== NOTCH =====*/
.notch{position:sticky;top:0;z-index:100;height:50px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.notch::before{content:'';width:120px;height:30px;background:var(--ink);border-radius:0 0 20px 20px;position:absolute;top:0}
@media(max-width:480px){.notch::before{width:var(--notch,120px);height:var(--safe-t,30px)}}

/*===== PAGE CONTAINER =====*/
.pages{position:relative;min-height:740px;overflow:hidden}
.pg{display:none;animation:pgIn .35s ease both}
.pg.active{display:block}
@keyframes pgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/*===== SHARED =====*/
.container{padding:0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:background .4s,border-color .4s}
.card-hover:hover{box-shadow:0 8px 28px -10px rgba(20,18,12,.1);transform:translateY(-2px);transition:all .3s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-sm);font-weight:500;min-height:48px;padding:12px 24px;font-size:15px;transition:all .25s}
.btn-gold{background:var(--gold);color:#fff;box-shadow:0 8px 24px -10px rgba(184,151,90,.5)}
.btn-gold:active{transform:scale(.97)}
.btn-out{border:1px solid var(--line);color:var(--ink)}
.btn-green{background:var(--green);color:#fff;box-shadow:0 8px 24px -10px rgba(44,95,74,.4)}
.btn-sm{min-height:40px;padding:8px 16px;font-size:13px}
.btn-full{width:100%}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-full);font-size:11px;font-weight:500;background:var(--paper2);color:var(--ink2);border:1px solid var(--line)}
.badge-gold{background:#FBF6E9;color:#7d6224;border-color:#E8D8AE}
.badge-green{background:#E7F2EC;color:var(--green);border-color:#C6E0CF}
.badge-amber{background:var(--amber-s);color:var(--amber);border-color:#EAD9B6}
.badge-rose{background:var(--rose-s);color:var(--rose);border-color:#E8C5C0}
html.dark .badge-gold{background:#332a17;color:var(--gold-l);border-color:#5a4720}
html.dark .badge-green{background:#16302a;color:#9bd2b8;border-color:#2a4f3f}

/*===== AVATAR =====*/
.av{border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:"Noto Naskh Arabic",serif;font-weight:600;color:#fff;position:relative;background:linear-gradient(135deg,var(--gold-s),var(--gold))}
.av img{width:100%;height:100%;object-fit:cover}
.av-green{background:linear-gradient(135deg,#A7CFBA,#2C5F4A)}
.av-stone{background:linear-gradient(135deg,#E8E4DC,#9B9B9B)}
.av .online{position:absolute;bottom:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#2C5F4A;border:2px solid var(--card)}

/*===== SCORE RING =====*/
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;font-family:"DM Serif Display",serif;line-height:1}

/*===== INPUT =====*/
.field{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 14px;min-height:48px;transition:border-color .2s}
.field:focus-within{border-color:var(--gold)}
.field input,.field select{flex:1;min-height:46px;font-size:15px}
.field input::placeholder{color:var(--ink3)}
.field-label{font-size:13px;color:var(--ink2);margin-bottom:6px;display:block}

/*===== PROGRESS BAR =====*/
.pbar{width:100%;height:6px;background:var(--line);border-radius:var(--r-full);overflow:hidden}
.pbar .fill{height:100%;background:var(--gold);border-radius:var(--r-full);transition:width .8s ease}

/*===== TOGGLE =====*/
.toggle{width:44px;height:24px;border-radius:var(--r-full);position:relative;transition:background .3s}
.toggle.off{background:var(--line)}
.toggle.on{background:var(--gold)}
.toggle::after{content:'';position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:all .3s}
.toggle.off::after{right:auto;left:2px}
.toggle.on::after{right:2px;left:auto}

/*===== HEADER (app pages) =====*/
.app-header{position:sticky;top:0;z-index:40;background:rgba(250,250,248,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(232,228,220,.6);padding:0 16px;transition:background .4s}
html.dark .app-header{background:rgba(15,15,14,.85);border-bottom-color:rgba(42,40,37,.6)}
.app-header-inner{display:flex;align-items:center;gap:10px;height:52px}
.app-header h1{font-family:"Noto Naskh Arabic",serif;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/*===== BOTTOM TABS =====*/
.btabs{position:sticky;bottom:0;z-index:40;background:rgba(250,250,248,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(232,228,220,.6);padding:6px 8px calc(6px + var(--safe-b));display:flex;justify-content:space-around;transition:background .4s}
html.dark .btabs{background:rgba(15,15,14,.9);border-top-color:rgba(42,40,37,.6)}
.btab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;border-radius:10px;min-width:52px;font-size:10px;color:var(--ink2);transition:color .2s}
.btab.active{color:var(--gold)}
.btab svg{width:22px;height:22px}

/*===== PAGE NAV =====*/
.pnav{position:fixed;bottom:16px;left:16px;z-index:200;display:flex;align-items:center;gap:8px}
.pnav-pill{display:flex;align-items:center;background:#1A1917;color:var(--fog);border-radius:var(--r-full);box-shadow:0 4px 20px rgba(0,0,0,.3);overflow:hidden;font-size:12px}
.pnav-pill button{padding:8px 10px;color:var(--fog);display:flex;align-items:center}
.pnav-pill button:hover{background:#222019}
.pnav-pill .label{padding:6px 8px;white-space:nowrap}
.pnav-dark{width:36px;height:36px;border-radius:50%;background:#1A1917;color:var(--fog);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.3)}

/*===== ANIMATIONS =====*/
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes meshMove{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(30px,-20px) scale(1.05)}50%{transform:translate(-15px,25px) scale(.97)}75%{transform:translate(-30px,-10px) scale(1.02)}}
@keyframes meshMove2{0%,100%{transform:translate(0,0)}33%{transform:translate(-40px,30px) scale(1.08)}66%{transform:translate(25px,-25px) scale(.95)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(184,151,90,.15)}50%{box-shadow:0 0 40px rgba(184,151,90,.35)}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin:0 2px;animation:blink 1.4s infinite both}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}

/*===== OVERLAY =====*/
.overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:301;background:var(--card);border-radius:20px 20px 0 0;max-height:85dvh;overflow-y:auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.32,.72,0,1);padding:0 20px calc(20px + var(--safe-b))}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:12px auto 16px}

/*===== SCROLLBAR =====*/
::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>

</div>

function icon(n,s=20,sw=1.6,cls=''){return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" class="${cls}">${I[n]||I.info}</svg>`}
function logo(s=28){return `<svg width="${s}" height="${s}" viewBox="0 0 40 40" style="color:var(--gold)"><path d="M8 30c5-1 8-5 12-15 4 10 7 14 12 15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 15v15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="20" cy="11" r="2.4" fill="currentColor"/></svg>`}

// BOTTOM TAB BAR
function btabs(active){
  const tabs=[{id:"dashboard",label:"الرئيسية",icon:"home"},{id:"matches",label:"التوافقات",icon:"heart"},{id:"requests-received",label:"الطلبات",icon:"inbox"},{id:"chats",label:"المحادثات",icon:"chat"},{id:"settings",label:"حسابي",icon:"user"}];
  return `<div class="btabs">${tabs.map(t=>{
    const act=t.id===active||(t.id==='settings'&&active.startsWith('settings'))||(t.id==='requests-received'&&active==='requests-sent');
    return `<button class="btab${act?' active':''}" onclick="go('${t.id}')">${icon(t.icon,22,act?2:1.6)}<span>${t.label}</span></button>`
  }).join('')}</div>`
}

// APP LAYOUT WRAPPER
function appLayout(id,title,content,headerRight=''){
  return `<div class="app-header"><div class="app-header-inner"><h1>${title}</h1>${headerRight}</div></div><div class="container" style="padding-top:16px;padding-bottom:80px">${content}</div>${btabs(id)}`
}

  const isIOS=/iPad|iPhone|iPod/.test(ua);
  const isAnd=/Android/i.test(ua);
  const platform=isIOS?'ios':isAnd?'android':'desktop';
  const steps={ios:[['افتح تَوَافُق في Safari','متصفح Safari مطلوب — لا يعمل من Chrome.'],['اضغط زر المشاركة ⬆','المربع مع السهم — في أسفل الشاشة.'],['اختر "إضافة إلى الشاشة الرئيسية"','ثم اضغط "إضافة" في الأعلى.']],android:[['افتح تَوَافُق في Chrome','استخدم Google Chrome للتثبيت.'],['اضغط القائمة ⋮','النقاط الثلاث في أعلى المتصفح.'],['اختر "تثبيت التطبيق"','أكّد بالضغط على "تثبيت".']],desktop:[['افتح تَوَافُق في Chrome','أو Microsoft Edge.'],['ابحث عن أيقونة التثبيت','في نهاية شريط العنوان.'],['اضغط "تثبيت"','يُضاف لسطح المكتب.']]};
  return `
<div style="padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)"><span onclick="go('landing')" style="cursor:pointer">${logo(24)}</span><button class="btn btn-out btn-sm" onclick="go('landing')">${icon('arrowR',14)} الرئيسية</button></div>
<div class="container" style="padding-top:24px;padding-bottom:40px;text-align:center">
  <span style="font-size:11px;letter-spacing:.2em;color:var(--gold)">حمّل التطبيق</span>
  <h1 class="dp" style="font-size:22px;margin-top:6px">استخدم تَوَافُق كتطبيق</h1>
  <p style="color:var(--ink2);font-size:14px;margin-top:8px;line-height:1.8">أضف تَوَافُق لشاشتك واستمتع بتجربة أسرع وإشعارات فورية.</p>
  <div style="width:160px;height:320px;border-radius:28px;border:3px solid var(--ink);background:var(--paper2);margin:24px auto;position:relative;overflow:hidden;box-shadow:0 16px 40px -12px rgba(0,0,0,.15)">
    <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:80px;height:20px;background:var(--ink);border-radius:0 0 12px 12px"></div>
    <div style="position:absolute;inset:6px;border-radius:22px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
      <div style="width:52px;height:52px;border-radius:14px;background:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(184,151,90,.3);animation:bounce 2s ease infinite">${logo(28).replace('style="color:var(--gold)"','style="color:#fff"')}</div>
      <div style="font-size:11px;font-weight:500;color:var(--ink2)">تَوَافُق</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;justify-content:center;margin-bottom:24px;flex-wrap:wrap">${[['ios','iPhone'],['android','Android'],['desktop','كمبيوتر']].map(([id,l])=>`<button style="padding:8px 16px;border-radius:var(--r-full);font-size:13px;min-height:44px;${platform===id?'background:var(--gold);color:#fff;border:1px solid var(--gold)':'border:1px solid var(--line);color:var(--ink2)'}">${l}</button>`).join('')}</div>
  <div style="text-align:right">${(steps[platform]||steps.desktop).map((s,i)=>`<div class="card" style="margin-bottom:10px;display:flex;gap:14px;align-items:flex-start">

  <p style="color:var(--ink2);margin-top:8px;font-size:14px">يبدو أن هذه الصفحة لم تعد متاحة أو تم نقلها.</p>
  <button class="btn btn-gold" style="margin-top:24px" onclick="go('landing')">العودة للرئيسية</button>

// ===== ROUTING =====
function go(id){
  if(!PAGES[id]){console.warn('Unknown page:',id);id='404'}
  currentPage=id;
  window.location.hash=id;
  const pagesEl=document.getElementById('pages');
  pagesEl.innerHTML=`<div class="pg active">${PAGES[id]()}</div>`;
  pagesEl.scrollTop=0;
  document.getElementById('phone').scrollTop=0;
  updatePNav();
  // Lazy load images
  pagesEl.querySelectorAll('img[src*="picsum"]').forEach(img=>{img.loading='lazy'});
}
function updatePNav(){
  const idx=PAGE_IDS.indexOf(currentPage);
  document.getElementById('pnavLabel').textContent=`${idx+1}/${PAGE_IDS.length}`;
  document.getElementById('pnavLabel').onclick=()=>openPgList();
}
function prevPage(){const idx=PAGE_IDS.indexOf(currentPage);go(PAGE_IDS[(idx-1+PAGE_IDS.length)%PAGE_IDS.length])}
function nextPage(){const idx=PAGE_IDS.indexOf(currentPage);go(PAGE_IDS[(idx+1)%PAGE_IDS.length])}

// ===== PAGE LIST =====
function openPgList(){
  document.getElementById('pgListOverlay').classList.add('open');
  document.getElementById('pgListSheet').classList.add('open');
  const items=document.getElementById('pgListItems');
  items.innerHTML=PAGE_IDS.map((id,i)=>`<button style="text-align:right;padding:10px 14px;border-radius:var(--r-sm);border:1px solid ${currentPage===id?'var(--gold)':'var(--line)'};${currentPage===id?'background:rgba(184,151,90,.08);color:var(--gold)':''};display:flex;justify-content:space-between;font-size:14px;min-height:44px;align-items:center" onclick="go('${id}');closePgList()"><span>${PAGE_NAMES[i]}</span><span class="sn" style="font-size:12px;color:var(--ink3)">${i+1}</span></button>`).join('');
}
function closePgList(){
  document.getElementById('pgListOverlay').classList.remove('open');
  document.getElementById('pgListSheet').classList.remove('open');
}

// ===== DARK MODE =====
function toggleDark(){
  document.documentElement.classList.toggle('dark');
  const isDark=document.documentElement.classList.contains('dark');
  try{localStorage.setItem('tw-dark',isDark?'1':'0')}catch{}
  document.getElementById('darkBtn').textContent=isDark?'☀':'☽';
}
(function(){try{if(localStorage.getItem('tw-dark')==='1'){document.documentElement.classList.add('dark');document.getElementById('darkBtn').textContent='☀'}}catch{}})();

// ===== INIT =====
(function(){
  const hash=window.location.hash.replace('#','');
  go(hash&&PAGES[hash]?hash:'landing');
  window.addEventListener('hashchange',()=>{
    const h=window.location.hash.replace('#','');
    if(h&&PAGES[h]&&h!==currentPage)go(h);
  });
})();
</script>
